<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>House Price Predictor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8;
           color: #222; padding: 30px; }
    h1 { color: #1F3864; margin-bottom: 6px; }
    .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { background: white; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 24px; }
    label { display: block; font-size: 13px; font-weight: 600;
            color: #444; margin-bottom: 4px; margin-top: 12px; }
    input, select { width: 100%; padding: 8px 10px; border: 1px solid #ddd;
                    border-radius: 6px; font-size: 14px; }
    button { margin-top: 20px; width: 100%; padding: 13px;
             background: #2E5FA3; color: white; border: none;
             border-radius: 8px; font-size: 16px; cursor: pointer;
             font-weight: 600; transition: background .2s; }
    button:hover { background: #1F3864; }
    .results { display: none; margin-top: 20px; }
    .result-card { background: white; border-radius: 10px; padding: 20px;
                   margin-bottom: 12px; border-left: 5px solid #ccc; }
    .result-card.lgbm { border-color: #1D6A3A; }
    .result-card.ann  { border-color: #2E5FA3; }
    .result-card.best { background: #f0fff4; }
    .model-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .price { font-size: 28px; font-weight: 700; color: #1F3864; }
    .meta  { font-size: 12px; color: #888; margin-top: 4px; }
    .badge { display: inline-block; background: #1D6A3A; color: white;
             font-size: 11px; padding: 2px 8px; border-radius: 20px;
             margin-left: 8px; vertical-align: middle; }
    .error { background: #fff0f0; border: 1px solid #ffaaaa;
             border-radius: 8px; padding: 12px; color: #c00; }
  </style>
</head>
<body>
  <h1>House Price Predictor</h1>

  <div class="grid">
    <div class="card">
      <h3 style="color:#2E5FA3;margin-bottom:8px">Caractéristiques du bien</h3>

      <label>Qualité générale (OverallQual 1–10)</label>
      <input type="number" id="OverallQual" min="1" max="10" value="7">

      <label>Surface habitable (GrLivArea pi²)</label>
      <input type="number" id="GrLivArea" value="1710">

      <label>Surface sous-sol totale (TotalBsmtSF pi²)</label>
      <input type="number" id="TotalBsmtSF" value="856">

      <label>Surface 1er étage (1stFlrSF pi²)</label>
      <input type="number" id="1stFlrSF" value="856">

      <label>Année de construction (YearBuilt)</label>
      <input type="number" id="YearBuilt" value="2003">

      <label>Année de rénovation (YearRemodAdd)</label>
      <input type="number" id="YearRemodAdd" value="2003">

      <label>Capacité garage (GarageCars)</label>
      <input type="number" id="GarageCars" min="0" max="4" value="2">

      <label>Surface garage (GarageArea pi²)</label>
      <input type="number" id="GarageArea" value="548">
    </div>

    <div class="card">
      <h3 style="color:#2E5FA3;margin-bottom:8px">Caractéristiques qualitatives</h3>

      <label>Quartier (Neighborhood)</label>
      <select id="Neighborhood">
        <option>CollgCr</option><option>Veenker</option><option>Crawfor</option>
        <option>NoRidge</option><option>Mitchel</option><option>Somerst</option>
        <option>NWAmes</option><option>OldTown</option><option>BrkSide</option>
        <option>NAmes</option><option>NPkVill</option><option>SWISU</option>
      </select>

      <label>Zonage (MSZoning)</label>
      <select id="MSZoning">
        <option>RL</option><option>RM</option><option>RH</option>
        <option>FV</option><option>C (all)</option>
      </select>

      <label>Type bâtiment (BldgType)</label>
      <select id="BldgType">
        <option>1Fam</option><option>2fmCon</option><option>Duplex</option>
        <option>TwnhsE</option><option>Twnhs</option>
      </select>

      <label>Qualité cuisine (KitchenQual)</label>
      <select id="KitchenQual">
        <option>Gd</option><option>Ex</option><option>TA</option><option>Fa</option>
      </select>

      <label>Qualité extérieure (ExterQual)</label>
      <select id="ExterQual">
        <option>Gd</option><option>Ex</option><option>TA</option><option>Fa</option>
      </select>

      <label>Climatisation centrale (CentralAir)</label>
      <select id="CentralAir">
        <option>Y</option><option>N</option>
      </select>

      <label>Condition de vente (SaleCondition)</label>
      <select id="SaleCondition">
        <option>Normal</option><option>Abnorml</option><option>Partial</option>
        <option>AdjLand</option><option>Alloca</option><option>Family</option>
      </select>

      <label>Type de vente (SaleType)</label>
      <select id="SaleType">
        <option>WD</option><option>New</option><option>COD</option><option>Con</option>
      </select>
    </div>
  </div>

  <button onclick="predict()">Prédire le prix de vente</button>

  <div class="results" id="results">
    <div class="result-card lgbm best" id="card-lgbm">
      <div class="model-name">
        ✅ LightGBM <span class="badge">Recommandé</span>
      </div>
      <div class="price" id="price-lgbm">—</div>
      <div class="meta" id="meta-lgbm"></div>
    </div>
    <div class="result-card ann" id="card-ann">
      <div class="model-name">ANN-4 Residual MLP</div>
      <div class="price" id="price-ann">—</div>
      <div class="meta" id="meta-ann"></div>
    </div>
  </div>

  <div id="error-box" class="error" style="display:none;margin-top:16px"></div>

  <script>
    async function predict() {
      document.getElementById("error-box").style.display = "none";

      // Récupère les champs — noms identiques aux colonnes de train.csv
      const payload = {
        OverallQual:   +document.getElementById("OverallQual").value,
        GrLivArea:     +document.getElementById("GrLivArea").value,
        TotalBsmtSF:   +document.getElementById("TotalBsmtSF").value,
        "1stFlrSF":    +document.getElementById("1stFlrSF").value,
        YearBuilt:     +document.getElementById("YearBuilt").value,
        YearRemodAdd:  +document.getElementById("YearRemodAdd").value,
        GarageCars:    +document.getElementById("GarageCars").value,
        GarageArea:    +document.getElementById("GarageArea").value,
        Neighborhood:  document.getElementById("Neighborhood").value,
        MSZoning:      document.getElementById("MSZoning").value,
        BldgType:      document.getElementById("BldgType").value,
        KitchenQual:   document.getElementById("KitchenQual").value,
        ExterQual:     document.getElementById("ExterQual").value,
        CentralAir:    document.getElementById("CentralAir").value,
        SaleCondition: document.getElementById("SaleCondition").value,
        SaleType:      document.getElementById("SaleType").value,
        // Valeurs par défaut pour les colonnes non exposées dans l'UI
        MSSubClass: 60, Street: "Pave", LotShape: "Reg",
        LandContour: "Lvl", Utilities: "AllPub", LotConfig: "Inside",
        LandSlope: "Gtl", Condition1: "Norm", Condition2: "Norm",
        HouseStyle: "2Story", OverallCond: 5, RoofStyle: "Gable",
        RoofMatl: "CompShg", Exterior1st: "VinylSd", Exterior2nd: "VinylSd",
        ExterCond: "TA", Foundation: "PConc", BsmtQual: "Gd",
        BsmtCond: "TA", BsmtExposure: "No", BsmtFinType1: "GLQ",
        BsmtFinSF1: 500, BsmtFinType2: "Unf", BsmtFinSF2: 0,
        BsmtUnfSF: 150, Heating: "GasA", HeatingQC: "Ex",
        Electrical: "SBrkr", "2ndFlrSF": 500, LowQualFinSF: 0,
        BsmtFullBath: 1, BsmtHalfBath: 0, FullBath: 2, HalfBath: 1,
        Bedroom: 3, Kitchen: 1, TotRmsAbvGrd: 8, Functional: "Typ",
        Fireplaces: 0, GarageType: "Attchd", GarageYrBlt: 2003,
        GarageFinish: "RFn", GarageQual: "TA", GarageCond: "TA",
        PavedDrive: "Y", WoodDeckSF: 0, OpenPorchSF: 60,
        EnclosedPorch: 0, "3SsnPorch": 0, ScreenPorch: 0,
        PoolArea: 0, MiscVal: 0, MoSold: 6, YrSold: 2008,
        LotFrontage: 65, LotArea: 8500, MasVnrType: "BrkFace",
        MasVnrArea: 100
      };

      try {
        const res = await fetch("http://localhost:5000/predict/both", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const d = await res.json();
        if (d.error) throw new Error(d.error);

        document.getElementById("price-lgbm").textContent =
          "$" + d.LightGBM.price_usd.toLocaleString("en-US", {minimumFractionDigits:0});
        document.getElementById("meta-lgbm").textContent =
          `R² test = ${d.LightGBM.r2_test} | RMSE = 0.1139`;

        document.getElementById("price-ann").textContent =
          "$" + d["ANN-4_Residual_MLP"].price_usd.toLocaleString("en-US", {minimumFractionDigits:0});
        document.getElementById("meta-ann").textContent =
          `R² test = ${d["ANN-4_Residual_MLP"].r2_test} | RMSE = 0.1877`;

        document.getElementById("results").style.display = "block";
      } catch (e) {
        document.getElementById("error-box").textContent = "Erreur : " + e.message;
        document.getElementById("error-box").style.display = "block";
      }
    }
  </script>
</body>
</html>
